<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Medication Tracker</title>
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#4a7c59" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body style="margin:0;background:#faf9f7;">
<div id="app"></div>

<style>
  :root {
    --bg: #faf9f7;
    --card: #ffffff;
    --border: #e5e1db;
    --text: #2b2925;
    --muted: #8a8578;
    --accent: #4a7c59;
    --accent-light: #e8f3ea;
    --danger: #b5533c;
    --danger-light: #fbebe6;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  #app {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 60px;
    max-width: 480px;
    margin: 0 auto;
  }
  h1 { font-size: 22px; font-weight: 700; margin: 4px 0 2px; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .med-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .med-info { flex: 1; min-width: 0; }
  .med-name { font-weight: 600; font-size: 16px; }
  .med-meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .btn {
    border: none; border-radius: 10px; padding: 10px 14px; font-size: 14px;
    font-weight: 600; cursor: pointer; white-space: nowrap; transition: transform 0.05s ease;
  }
  .btn:active { transform: scale(0.96); }
  .btn-take { background: var(--accent); color: white; }
  .btn-taken { background: var(--accent-light); color: var(--accent); }
  .btn-undo { background: transparent; color: var(--danger); font-size: 12px; padding: 4px 6px; text-decoration: underline; }
  .taken-time { font-size: 12px; color: var(--accent); margin-top: 2px; font-weight: 600; }
  .add-form { display: flex; flex-direction: column; gap: 10px; }
  .add-form input {
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    font-size: 14px; font-family: inherit; background: var(--bg); color: var(--text);
  }
  .add-form input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row-2 { display: flex; gap: 8px; }
  .row-2 input { flex: 1; min-width: 0; }
  .btn-add { background: var(--text); color: white; align-self: flex-start; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 14px; }
  .section-label {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); font-weight: 700; margin: 22px 0 8px 4px;
  }
  .delete-x { background: transparent; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 4px; line-height: 1; }
  .toggle-form-btn {
    background: transparent; color: var(--accent); border: 1px dashed var(--border);
    width: 100%; padding: 12px; border-radius: var(--radius); font-weight: 600; cursor: pointer; font-size: 14px;
  }
  .loading, .signin-screen { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 14px; }
  .date-line { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .freq-label { font-size: 13px; font-weight: 600; color: var(--text); margin-top: 4px; }
  .freq-options { display: flex; gap: 8px; }
  .freq-btn {
    flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .freq-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .day-picker { display: flex; gap: 4px; flex-wrap: wrap; }
  .day-chip {
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .day-chip.active { background: var(--accent); color: white; border-color: var(--accent); }
  .g-signin-btn {
    background: white; color: #3c4043; border: 1px solid #dadce0; border-radius: 10px;
    padding: 12px 20px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 16px;
  }
  .status-line { font-size: 12px; color: var(--muted); text-align: center; margin-top: 18px; }
  .error-box {
    background: var(--danger-light); color: var(--danger); border-radius: 10px;
    padding: 12px; font-size: 13px; margin: 16px 0;
  }
</style>

<script>
(function() {
  // ====== CONFIGURATION ======
  // Replace this with the OAuth Client ID from your Google Cloud project.
  const CLIENT_ID = '1087953047967-oi91huc3j0i0lojpsrapf6ltrti2o4ht.apps.googleusercontent.com.apps.googleusercontent.com';
  const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.email profile';
  const DRIVE_FILE_NAME = 'medication-tracker-data.json';
  // ============================

  const root = document.getElementById('app');
  const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  let medications = [];
  let takenLog = {};
  let loaded = false;
  let showAddForm = false;
  let newMedFrequency = 'daily';
  let newMedDays = [];
  let accessToken = null;
  let driveFileId = null;
  let signInError = null;
  let tokenClient = null;
  let currentUser = null;

  function todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function todayDayIndex() { return new Date().getDay(); }
  function formatDateNice() {
    return new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  }
  function formatTimeNow() {
    return new Date().toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }
  function uid() { return 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7); }
  function escapeHtml(str) {
    const d = document.createElement('div');
    d.innerText = str;
    return d.innerHTML;
  }
  function isScheduledToday(med) {
    if (!med.frequency || med.frequency === 'daily') return true;
    return (med.days || []).includes(todayDayIndex());
  }

  // ---------- Google Sign-In ----------
  function initGoogle() {
    if (typeof google === 'undefined' || !google.accounts) {
      setTimeout(initGoogle, 200);
      return;
    }
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: async (resp) => {
        if (resp.error) {
          signInError = 'Sign-in was not completed. Please try again.';
          render();
          return;
        }
        accessToken = resp.access_token;
        signInError = null;
        await fetchUserInfo();
        await loadFromDrive();
      }
    });
    // Try a silent sign-in first (works if you've already granted access before)
    tokenClient.requestAccessToken({ prompt: '' });
    render();
  }

  function signIn() {
    signInError = null;
    tokenClient.requestAccessToken({ prompt: 'consent' });
  }

  function switchAccount() {
    signInError = null;
    accessToken = null;
    loaded = false;
    currentUser = null;
    render();
    tokenClient.requestAccessToken({ prompt: 'select_account' });
  }

  function signOut() {
    if (accessToken && google.accounts && google.accounts.oauth2) {
      google.accounts.oauth2.revoke(accessToken, () => {});
    }
    accessToken = null;
    loaded = false;
    currentUser = null;
    medications = [];
    takenLog = {};
    render();
  }

  async function fetchUserInfo() {
    try {
      const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
        headers: { Authorization: 'Bearer ' + accessToken }
      });
      currentUser = await res.json();
    } catch (e) {
      currentUser = null;
    }
  }

  // ---------- Drive helpers ----------
  async function driveFetch(url, options = {}) {
    const res = await fetch(url, {
      ...options,
      headers: {
        ...(options.headers || {}),
        Authorization: 'Bearer ' + accessToken
      }
    });
    if (!res.ok) {
      const text = await res.text();
      throw new Error('Drive API error ' + res.status + ': ' + text);
    }
    return res;
  }

  async function findDriveFile() {
    const url = 'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=' +
      encodeURIComponent(`name='${DRIVE_FILE_NAME}'`) + '&fields=files(id,name)';
    const res = await driveFetch(url);
    const data = await res.json();
    return (data.files && data.files[0]) ? data.files[0].id : null;
  }

  async function createDriveFile(initialData) {
    const metadata = { name: DRIVE_FILE_NAME, parents: ['appDataFolder'] };
    const boundary = 'medtracker_boundary';
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n` +
      JSON.stringify(metadata) + `\r\n` +
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n` +
      JSON.stringify(initialData) + `\r\n` +
      `--${boundary}--`;
    const res = await driveFetch(
      'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
      {
        method: 'POST',
        headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
        body
      }
    );
    const data = await res.json();
    return data.id;
  }

  async function readDriveFile(fileId) {
    const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    const text = await res.text();
    try { return JSON.parse(text); } catch (e) { return { medications: [], takenLog: {} }; }
  }

  async function writeDriveFile(fileId, dataObj) {
    await driveFetch(
      `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`,
      {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dataObj)
      }
    );
  }

  async function loadFromDrive() {
    try {
      let fileId = await findDriveFile();
      if (!fileId) {
        fileId = await createDriveFile({ medications: [], takenLog: {} });
      }
      driveFileId = fileId;
      const data = await readDriveFile(fileId);
      medications = data.medications || [];
      takenLog = data.takenLog || {};
      loaded = true;
      signInError = null;
    } catch (e) {
      console.error(e);
      signInError = 'Could not load data from Google Drive. Check your connection and try again.';
    }
    render();
  }

  async function saveToDrive() {
    if (!driveFileId) return;
    try {
      await writeDriveFile(driveFileId, { medications, takenLog });
    } catch (e) {
      console.error('Save failed', e);
      signInError = 'Could not save to Google Drive. Your change is kept on screen but may not have synced.';
      render();
    }
  }

  // ---------- Mutations ----------
  async function addMedication(name, dose, time) {
    if (!name.trim()) return;
    const med = {
      id: uid(),
      name: name.trim(),
      dose: dose.trim(),
      time: time.trim(),
      frequency: newMedFrequency,
      days: newMedFrequency === 'specific' ? [...newMedDays] : []
    };
    medications.push(med);
    showAddForm = false;
    newMedFrequency = 'daily';
    newMedDays = [];
    render();
    await saveToDrive();
  }

  async function deleteMedication(id) {
    medications = medications.filter(m => m.id !== id);
    render();
    await saveToDrive();
  }

  async function markTaken(id) {
    const key = todayKey();
    if (!takenLog[key]) takenLog[key] = {};
    takenLog[key][id] = formatTimeNow();
    render();
    await saveToDrive();
  }

  async function undoTaken(id) {
    const key = todayKey();
    if (takenLog[key]) delete takenLog[key][id];
    render();
    await saveToDrive();
  }

  function toggleNewMedDay(dayIndex) {
    const i = newMedDays.indexOf(dayIndex);
    if (i === -1) newMedDays.push(dayIndex); else newMedDays.splice(i, 1);
    render();
  }

  function setNewMedFrequency(freq) {
    newMedFrequency = freq;
    render();
  }

  // ---------- Rendering ----------
  function medRow(med) {
    const key = todayKey();
    const takenAt = takenLog[key] && takenLog[key][med.id];
    const metaParts = [];
    if (med.dose) metaParts.push(med.dose);
    if (med.time) metaParts.push('Usually ' + med.time);
    if (med.frequency === 'specific' && med.days && med.days.length) {
      metaParts.push(med.days.slice().sort().map(d => DAY_NAMES[d]).join(', '));
    }
    const meta = metaParts.join(' · ');

    return `
      <div class="card">
        <div class="med-row">
          <div class="med-info">
            <div class="med-name">${escapeHtml(med.name)}</div>
            ${meta ? `<div class="med-meta">${escapeHtml(meta)}</div>` : ''}
            ${takenAt ? `<div class="taken-time">✓ Taken today at ${takenAt}</div>` : ''}
          </div>
          ${takenAt
            ? `<button class="btn btn-taken" disabled>Taken</button>`
            : `<button class="btn btn-take" onclick="window.__medApp.markTaken('${med.id}')">Mark taken</button>`
          }
          <button class="delete-x" title="Remove medication" onclick="window.__medApp.deleteMedication('${med.id}')">✕</button>
        </div>
        ${takenAt ? `<div style="text-align:right;margin-top:4px;"><button class="btn-undo" onclick="window.__medApp.undoTaken('${med.id}')">Undo</button></div>` : ''}
      </div>
    `;
  }

  function renderSignIn() {
    root.innerHTML = `
      <h1>💊 Medication Tracker</h1>
      <div class="signin-screen">
        <p>Sign in with Google to load your medication data from Drive.</p>
        ${signInError ? `<div class="error-box">${escapeHtml(signInError)}</div>` : ''}
        <button class="g-signin-btn" id="signin-btn">Sign in with Google</button>
      </div>
    `;
    const btn = document.getElementById('signin-btn');
    if (btn) btn.onclick = () => window.__medApp.signIn();
  }

  function render() {
    if (!tokenClient) {
      root.innerHTML = `<div class="loading">Starting up...</div>`;
      return;
    }
    if (!accessToken || !loaded) {
      renderSignIn();
      return;
    }

    const todaysMeds = medications.filter(isScheduledToday);
    const listHtml = todaysMeds.length
      ? todaysMeds.map(medRow).join('')
      : (medications.length
          ? `<div class="empty">Nothing scheduled for today.</div>`
          : `<div class="empty">No medications added yet.<br/>Add your first one below.</div>`);

    const dayPickerHtml = DAY_NAMES.map((d, i) => `
      <button type="button" class="day-chip ${newMedDays.includes(i) ? 'active' : ''}"
        onclick="window.__medApp.toggleDay(${i})">${d}</button>
    `).join('');

    const addFormHtml = showAddForm ? `
      <div class="card add-form">
        <input id="med-name-input" type="text" placeholder="Medication name (e.g. Metformin)" />
        <div class="row-2">
          <input id="med-dose-input" type="text" placeholder="Dose (e.g. 500mg)" />
          <input id="med-time-input" type="text" placeholder="Usual time (e.g. 8:00 AM)" />
        </div>
        <div class="freq-label">How often?</div>
        <div class="freq-options">
          <button type="button" class="freq-btn ${newMedFrequency === 'daily' ? 'active' : ''}" onclick="window.__medApp.setFrequency('daily')">Every day</button>
          <button type="button" class="freq-btn ${newMedFrequency === 'specific' ? 'active' : ''}" onclick="window.__medApp.setFrequency('specific')">Specific days</button>
        </div>
        ${newMedFrequency === 'specific' ? `
          <div class="freq-label">Which days of the month ?</div>
          <div class="day-picker">${dayPickerHtml}</div>
        ` : ''}
        <div class="row-2" style="margin-top:6px;">
          <button class="btn btn-add" id="save-med-btn">Add medication</button>
          <button class="btn" style="background:transparent;color:var(--muted);" id="cancel-add-btn">Cancel</button>
        </div>
      </div>
    ` : `
      <button class="toggle-form-btn" id="show-add-btn">+ Add a medication</button>
    `;

    const accountBarHtml = currentUser ? `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <div style="font-size:12px;color:var(--muted);">Signed in as <strong>${escapeHtml(currentUser.email || currentUser.name || '')}</strong></div>
        <div style="display:flex;gap:10px;">
          <button class="btn-undo" style="color:var(--accent);" id="switch-account-btn">Switch account</button>
          <button class="btn-undo" id="sign-out-btn">Sign out</button>
        </div>
      </div>
    ` : '';

    root.innerHTML = `
      <h1>💊 Medication Tracker</h1>
      ${accountBarHtml}
      <div class="date-line">${formatDateNice()}</div>
      <div class="subtitle">Tap "Mark taken" once you've taken a dose — it stays marked for today so you don't accidentally take it twice.</div>
      ${signInError ? `<div class="error-box">${escapeHtml(signInError)}</div>` : ''}
      <div class="section-label">Today</div>
      ${listHtml}
      <div class="section-label">Manage</div>
      ${addFormHtml}
      <div class="status-line">Synced with Google Drive</div>
    `;

    if (showAddForm) {
      document.getElementById('save-med-btn').onclick = () => {
        const name = document.getElementById('med-name-input').value;
        const dose = document.getElementById('med-dose-input').value;
        const time = document.getElementById('med-time-input').value;
        addMedication(name, dose, time);
      };
      document.getElementById('cancel-add-btn').onclick = () => {
        showAddForm = false;
        newMedFrequency = 'daily';
        newMedDays = [];
        render();
      };
      document.getElementById('med-name-input').focus();
    } else {
      document.getElementById('show-add-btn').onclick = () => {
        showAddForm = true;
        render();
      };
    }

    const switchBtn = document.getElementById('switch-account-btn');
    if (switchBtn) switchBtn.onclick = () => window.__medApp.switchAccount();
    const signOutBtn = document.getElementById('sign-out-btn');
    if (signOutBtn) signOutBtn.onclick = () => window.__medApp.signOut();
  }

  window.__medApp = {
    markTaken, undoTaken, deleteMedication, signIn, switchAccount, signOut,
    toggleDay: toggleNewMedDay, setFrequency: setNewMedFrequency
  };

  initGoogle();
})();
</script>
</body>
</html>
